<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#0E1311;color:#F2F5F3;font-family:Inter,system-ui,sans-serif;position:relative}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 20px 0}
.top h2{font-size:28px;font-weight:700;letter-spacing:-.03em}
.ic{width:44px;height:44px;border-radius:14px;background:#171E1B;display:flex;align-items:center;justify-content:center;font-size:18px}
.lbl{padding:20px 20px 0;font-size:13px;font-weight:600;color:#9AA59F;display:flex;justify-content:space-between}
.rod{margin:12px 20px 0;height:3px;background:#2E3833;border-radius:2px}
.rail{display:flex;gap:12px;padding:0 20px;overflow:hidden}
.item{width:92px;flex:none;position:relative;padding-top:14px}
.item:before{content:"";position:absolute;top:-2px;left:50%;width:14px;height:16px;border:2px solid #4A5650;border-bottom:0;border-radius:8px 8px 0 0;transform:translateX(-50%)}
.pic{height:118px;border-radius:16px}
.item b{display:block;font-size:12px;margin-top:8px}.item small{font-size:11px;color:#9AA59F}
.add .pic{background:#171E1B;border:1.5px dashed #4A5650;display:flex;align-items:center;justify-content:center;font-size:28px;color:#D8EFBD}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:26px 20px 0}
.slot{background:#171E1B;border-radius:22px;padding:10px;border:1.5px solid #212A26}
.slot.on{border-color:#D8EFBD}
.big{height:196px;border-radius:16px;position:relative}
.tag{position:absolute;left:10px;top:10px;width:36px;height:36px;border-radius:12px;background:#D8EFBD;color:#0E1311;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.b .tag{background:#212A26;color:#F2F5F3}
.nm{font-size:14px;font-weight:600;margin-top:10px}.pr{font-size:12px;color:#9AA59F;margin-top:3px}
.cta{position:absolute;left:20px;right:20px;bottom:40px;height:58px;border-radius:18px;background:#D8EFBD;color:#0E1311;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.ghost{position:absolute;left:0;right:0;bottom:108px;text-align:center;font-size:13px;color:#9AA59F;font-weight:500}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="top"><h2>Your rail</h2><div class="ic">♡</div></div>
<div class="lbl"><span>5 pieces · drag one onto A or B</span><span>Edit</span></div>
<div class="rod"></div>
<div class="rail">
  <div class="item add"><div class="pic">+</div><b>Add</b><small>Upload photo</small></div>
  <div class="item"><div class="pic" style="background:#3B4A42"></div><b>Overshirt</b><small>Linen · A</small></div>
  <div class="item"><div class="pic" style="background:#5A4A42"></div><b>Satin midi</b><small>Shop link</small></div>
  <div class="item"><div class="pic" style="background:#3E4553"></div><b>Denim</b><small>Sample</small></div>
</div>
<div class="slots">
  <div class="slot on"><div class="big" style="background:#3B4A42"><span class="tag">A</span></div><div class="nm">Linen overshirt</div><div class="pr">690.000₫ · user-entered</div></div>
  <div class="slot b"><div class="big" style="background:#5A4A42"><span class="tag">B</span></div><div class="nm">Satin midi</div><div class="pr">Price · check with shop</div></div>
</div>
<div class="ghost">Camera stays off until you tap below</div>
<div class="cta">Set up camera →</div>
</body></html>
