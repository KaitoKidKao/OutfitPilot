<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F3F5F2;color:#121A16;font-family:Inter,system-ui,sans-serif;position:relative}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;padding:2px 16px 0}
.back{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav b{font-size:16px}
.ticket{margin:14px 16px 0;background:#fff;border-radius:22px;display:grid;grid-template-columns:1fr 1fr;position:relative;box-shadow:0 1px 0 #E2E6E1}
.ticket:after{content:"";position:absolute;left:50%;top:12px;bottom:12px;border-left:1.5px dashed #D3D9D2}
.half{display:flex;gap:10px;align-items:center;padding:10px}
.half.a{background:#DDF3C4;border-radius:22px 0 0 22px}
.th{width:44px;height:54px;border-radius:10px;flex:none}
.k{font-size:11px;font-weight:700;letter-spacing:.04em}.v{font-size:13px;font-weight:600;margin-top:2px}
.hero{margin:16px 16px 0;height:330px;border-radius:24px;background:#E4ECE2;position:relative;overflow:hidden}
.g{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:170px;height:250px;background:#B9CDB4;border-radius:80px 80px 0 0}
.pill{position:absolute;left:14px;top:14px;background:#DDF3C4;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.sample{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.85);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}
.info{margin:16px 16px 0;background:#fff;border-radius:20px;padding:16px}
.info h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.r{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}
.r span{color:#55605A}.r b{font-weight:600}
.chk{color:#2F6B4F}
.cta{position:absolute;left:16px;right:16px;bottom:34px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.sec{height:56px;padding:0 18px;border-radius:18px;background:#DCE9FF;display:flex;align-items:center;font-size:15px;font-weight:700}
.pri{height:56px;border-radius:18px;background:#2F6B4F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="nav"><div class="back">‹</div><b>Your pair</b><div class="back">⋯</div></div>
<div class="ticket">
  <div class="half a"><div class="th" style="background:#B9CDB4"></div><div><div class="k">LOOK A</div><div class="v">Overshirt</div></div></div>
  <div class="half"><div class="th" style="background:#DCE9FF"></div><div><div class="k">LOOK B</div><div class="v">Satin midi</div></div></div>
</div>
<div class="hero"><div class="g"></div><span class="pill">Look A</span><span class="sample">Sample photo</span></div>
<div class="info">
  <h3>Linen overshirt</h3>
  <div class="r"><span>Shop</span><b>hanoi-linen.vn</b></div>
  <div class="r"><span>Price</span><b>690.000₫ · bạn nhập</b></div>
  <div class="r"><span>Size, fabric</span><b class="chk">Check with store</b></div>
</div>
<div class="cta"><div class="sec">Edit B</div><div class="pri">Set up camera</div></div>
</body></html>
