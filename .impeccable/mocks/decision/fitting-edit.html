<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F8F8F3;color:#162820;font-family:Inter,system-ui,sans-serif}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 0}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{color:#56705A;font-weight:500}
.saved{font-size:13px;font-weight:600;border:1px solid #E9EBE4;border-radius:999px;padding:9px 14px;background:#fff}
h1{font-size:52px;line-height:.98;letter-spacing:-.045em;font-weight:800;padding:26px 20px 0}
.sub{font-size:14px;line-height:1.45;color:#56625A;padding:12px 20px 0;max-width:320px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:22px 20px 0}
.look{position:relative;height:300px;border-radius:4px;overflow:hidden}
.look.a{background:#DFEAE7}.look.b{background:#F8E6DC}
.letter{position:absolute;left:10px;top:2px;font-size:96px;font-weight:800;letter-spacing:-.06em;line-height:1;color:#162820}
.garment{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:96px;height:150px;border-radius:44px 44px 6px 6px}
.a .garment{background:#6F856E}.b .garment{background:#C9A48E;border-radius:10px 10px 40px 40px;width:104px}
.cap{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:8px 10px;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.cap em{font-style:normal;color:#56625A;font-weight:500}
.steps{display:flex;gap:16px;padding:20px 20px 0;font-size:12px;color:#56625A;font-weight:500}
.steps b{color:#162820;font-weight:700;margin-right:4px}
.dock{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:#F8F8F3;border-top:1px solid #E9EBE4;display:grid;grid-template-columns:1fr auto;gap:10px}
.btn{height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.primary{background:#D8EFBD;color:#162820}
.ghost{background:#162820;color:#F8F8F3;padding:0 22px;font-size:15px}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="top"><div class="brand">OutfitPilot <span>Studio</span></div><div class="saved">Saved · 4</div></div>
<h1>Try it before you buy it.</h1>
<p class="sub">Upload two pieces, stand back, and compare them on you. <br>Thêm 2 món, lùi lại, so sánh trên chính bạn.</p>
<div class="pair">
  <div class="look a"><div class="letter">A</div><div class="garment"></div><div class="cap">Linen overshirt <em>Sample</em></div></div>
  <div class="look b"><div class="letter">B</div><div class="garment"></div><div class="cap">Satin midi <em>Sample</em></div></div>
</div>
<div class="steps"><span><b>01</b>Import</span><span><b>02</b>Set up</span><span><b>03</b>Try &amp; decide</span></div>
<div class="dock"><div class="btn primary">+ Add a product</div><div class="btn ghost">My looks</div></div>
</body></html>
